name: M04 Contract Validation

on:
  push:
    branches: ["Python-3"]
    paths:
      - "validation/**"
      - "tests/**"
      - ".github/workflows/m04-contract-validation.yml"
      - "contracts/**"
      - "schemas/**"
  workflow_dispatch:

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run M04 validation harness
        run: |
          python -m unittest discover -s tests -p 'test_validation_harness.py' -v
          python -m validation.harness validation-results.json
      - name: Upload machine-readable validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: m04-contract-validation-evidence
          path: validation-results.json
